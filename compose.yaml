name: unitycatalog

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8080"
    volumes:
      - type: bind
        source: ./etc/conf
        target: /opt/unitycatalog/etc/conf
      - type: volume
        source: unitycatalog_data
        target: /opt/unitycatalog/etc/data
    environment:
      - AWS_REGION=us-east-1
      - S3_REGION=us-east-1
      - UNITY_CATALOG_S3_BUCKET_PATH=s3://test-unitycatalog-nekt/root
      - UNITY_CATALOG_S3_BUCKET_ACCESS_ROLE_ARN=arn:aws:iam::123456789012:role/unitycatalog-s3-access-role
      - UNITY_CATALOG_S3_BUCKET_ACCESS_KEY=AKIAIOSFODNN7EXAMPLE
      - UNITY_CATALOG_S3_BUCKET_SECRET_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=uc_default_user
      - POSTGRES_PASSWORD=uc_default_password
      - POSTGRES_DATABASE=ucdb
      - POSTGRES_SCHEMA=myschema
      - POSTGRES_PORT=5432
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ucdb
      POSTGRES_USER: uc_default_user
      POSTGRES_PASSWORD: uc_default_password
    volumes:
      - postgres_data:/var/lib/postgres
  ui:
    build:
      context: ui/
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  # Persist docker volume across container restarts
  unitycatalog_data:
  postgres_data:
